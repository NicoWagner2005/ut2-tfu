# Balanceador de carga: unica puerta de entrada al sistema.
# El cliente solo conoce http://localhost:8080 y no sabe cuantas copias hay
# detras. Agregar o quitar copias no cambia la interfaz que ve el usuario.

events {}

http {
    # El "upstream" es el conjunto de copias del computo.
    # Por defecto nginx reparte los pedidos en round-robin entre ellas.
    # Para medir con UNA sola copia, comentar api2 y api3 y ejecutar:
    #   docker compose restart nginx
    upstream recetas {
        server api1:3000;
        server api2:3000;
        server api3:3000;
    }

    # Ruta alternativa usada exclusivamente por el script de demostracion.
    # Mantiene la misma API y seguridad, pero envia toda la carga a api1 para
    # poder comparar 1 copia contra 3 sin editar la configuracion en vivo.
    upstream recetas_una_copia {
        server api1:3000;
    }

    # Log que deja constancia de que copia atendio cada pedido y cuanto tardo.
    # Sirve como evidencia del reparto: docker compose logs nginx
    log_format balanceo '$time_iso8601 $request -> copia $upstream_addr '
                        'en $upstream_response_time s (total $request_time s)';
    access_log /var/log/nginx/access.log balanceo;

    server {
        listen 80;
        server_tokens off;
        client_max_body_size 1k;

        location /demo/una-copia/ {
            rewrite ^/demo/una-copia/(.*)$ /$1 break;
            proxy_pass http://recetas_una_copia;
            proxy_set_header Host $host;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://recetas;
            proxy_set_header Host $host;
            proxy_set_header X-API-Key $http_x_api_key;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
